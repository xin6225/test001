@for (article of articles; track article) {
  <section>
    <h2>{{ article?.city }}</h2>
    <h3>{{ article?.timestamp | datetime }} {{ article?.country }}</h3>

    @for (part of article?.contents; track part) {
      <div class="content">
        <span class="text">{{ part.description }}</span>
        <img class="article-image" [src]="part.imgUrl" alt="{{part.imgUrl}}"/>
      </div>
    }
  </section>
}
