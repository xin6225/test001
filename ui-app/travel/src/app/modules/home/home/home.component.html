@for (article of articles; track article) {
  <section>
    <h2>{{ article.title }}</h2>
    @for (part of article?.contents; track part) {
      <div class="content">
        <p class="text"> {{ part.description }}</p>
        <img [src]="part.imgUrl" class="article-image" alt="{{part.imgUrl}}"/>
        <p></p>
      </div>
    }
  </section>
}
